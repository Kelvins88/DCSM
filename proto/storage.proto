syntax = "proto3";

service Storage {
  rpc Upload (UploadRequest) returns (UploadReply);
  rpc Download (DownloadRequest) returns (DownloadReply);
  rpc List (ListRequest) returns (ListReply);
  rpc Delete (DeleteRequest) returns (DeleteReply);
}

message UploadRequest {
  string username = 1;
  string filename = 2;
  bytes content = 3;
  string label = 4;
}

message UploadReply {
  bool success = 1;
  string message = 2;
  string checksum = 3;
}

message DownloadRequest {
  string username = 1;
  string filename = 2;
}

message DownloadReply {
  bool success = 1;
  string message = 2;
  bytes content = 3;
  string checksum = 4;
}

message ListRequest {
  string username = 1;
}

message FileInfo {
  string filename = 1;
  string label = 2;
  string checksum = 3;
  string owner = 4;
}

message ListReply {
  repeated FileInfo files = 1;
}

message DeleteRequest {
  string username = 1;
  string filename = 2;
}

message DeleteReply {
  bool success = 1;
  string message = 2;
}
